<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Educativa</title>
</head>
<body>
  <h1>Bienvenido a la actividad educativa</h1>
  <p>Tu visita ha sido registrada exitosamente para fines estadísticos.</p>

  <script>
    // Reemplaza esta URL con la URL de tu Web App de Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz46cV3T3jLKVrEfNx19GhDAnxFpCLLje2gq-SLxRV_IHUHHFwJQNNFpSOq3mIVCAo32Q/exec";

    window.addEventListener("DOMContentLoaded", () => {
      // Capturar parámetros de la URL (ej. ?origen=qr_sala1)
      const urlParams = new URLSearchParams(window.location.search);
      const origen = urlParams.get('origen') || 'QR Predeterminado';

      const payload = {
        userAgent: navigator.userAgent,
        origen: origen
      };

      // Envío silencioso mediante fetch
      fetch(WEB_APP_URL, {
        method: "POST",
        mode: "no-cors", // Evita problemas de CORS con Apps Script
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      }).then(() => {
        console.log("Ingreso registrado");
      }).catch(err => {
        console.error("Error al registrar:", err);
      });
    });
  </script>
</body>
</html>
